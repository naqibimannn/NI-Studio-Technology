<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404: Halaman Tidak Ditemui | NI Studio Technology</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://nistudio.my/">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #f5f5f7;
      --ink: #1d1d1f;
      --ink-2: #6e6e73;
      --accent: #0071e3;
      --surface: #ffffff;
      --line: rgba(0, 0, 0, .08);
      --font: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f5f5f7;
        --ink-2: #a1a1a6;
        --accent: #2997ff;
        --surface: #1c1c1e;
        --line: rgba(255, 255, 255, .1);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 480px;
      padding: 48px 32px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .14);
    }
    .code {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -.02em;
      margin: 0 0 12px;
    }
    p {
      color: var(--ink-2);
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 14.5px;
      text-decoration: none;
      transition: transform .3s ease, box-shadow .3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -6px var(--accent);
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>Halaman Tidak Ditemui</h1>
    <p>Laman atau pautan yang anda cari mungkin telah dipindahkan, dipadam, atau tidak wujud.</p>
    <a href="https://nistudio.my/" class="btn">Kembali ke Laman Utama</a>
  </main>
</body>
</html>
